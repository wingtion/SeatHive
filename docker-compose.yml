version: '3.8'

# Secrets come from a .env file next to this file (copy .env.example to .env).
# Infrastructure ports are not published here; docker-compose.override.yml publishes them for local development.
# On a server run: docker compose -f docker-compose.yml up -d --build

services:
  # 1. API Service (Port 8080)
  api:
    image: seathive-api
    build:
      context: .
      dockerfile: SeatHive.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=seathivedb;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - SEATHIVE_ADMIN_EMAIL=${SEATHIVE_ADMIN_EMAIL:-}
      - SEATHIVE_ADMIN_PASSWORD=${SEATHIVE_ADMIN_PASSWORD:-}
      # Forwarded headers (client address, scheme) are believed only from this network: the reverse proxy joins it.
      - ReverseProxy__TrustedProxies__0=${COMPOSE_SUBNET:-172.28.0.0/24}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 2. Worker Service (Background Console App)
  worker:
    image: seathive-worker
    build:
      context: .
      dockerfile: SeatHive.Worker/Dockerfile
    environment:
      # The Worker keeps its message inbox and outbox in the "worker" schema of the same database.
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=seathivedb;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: seathive_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: seathivedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seathivedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. Redis Cache
  redis:
    image: redis:alpine
    container_name: seathive_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      # Lets redis-cli in the healthcheck authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 5. RabbitMQ Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: seathive_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

# A fixed subnet, so the API knows which addresses the reverse proxy can have (see ReverseProxy__TrustedProxies__0).
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/24}

volumes:
  postgres_data:
